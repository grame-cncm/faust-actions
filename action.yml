name: Faust build
description: >
  Compile a Faust program into binaries for macOS (universal: Intel and
  Apple Silicon), Linux and Windows: Max externals, CoreAudio/Qt or
  JACK/Qt applications, JUCE plugins, LV2 plugins, Pure Data externals,
  SuperCollider UGens or Csound opcodes.
author: GRAME
branding:
  icon: music
  color: orange

inputs:
  target:
    description: >
      max (macOS, Windows); caqt, jaqt (macOS); juce (macOS, Linux,
      Windows); puredata, supercollider, csound (macOS, Linux); lv2 (Linux)
    required: true
  dsp:
    description: >
      Path of the .dsp file, relative to the workspace. The files next to it
      with the extensions .lib, .dsp, .json, .wav, .aif, .aiff, .flac, .ogg
      and .mp3 are taken with it.
    default: ""
  dsp-from-event:
    description: >
      "true" to take the source from the dsp or archive input of the
      workflow_dispatch event instead of a file (for workflows started by a
      service)
    default: "false"
  name:
    description: "Program name, without .dsp (default: the name of the dsp file)"
    default: ""
  options:
    description: Options for the faust2xxx script, checked against its allow-list
    default: ""
  arch:
    description: >
      auto (universal on macOS, the runner's architecture elsewhere),
      universal, arm64 or x86_64 (jaqt: arm64; Linux and Windows: the
      runner's architecture only)
    default: auto
  faust-ref:
    description: Branch of grame-cncm/faust to build Faust from (faust2max6 and faust2caqt need -arch, not in a release yet)
    default: master-dev
  qt:
    description: Qt version, for caqt and jaqt
    default: 6.8.3
  juce:
    description: JUCE tag, for juce
    default: 8.0.10
  pd:
    description: Pure Data tag whose m_pd.h is used, for puredata on macOS (Linux uses puredata-dev)
    default: 0.56-5
  sc:
    description: SuperCollider tag whose headers are used, for supercollider on macOS (Linux uses supercollider-dev)
    default: Version-3.14.1
  csound:
    description: Csound release whose headers are used, for csound on macOS (Linux uses libcsound64-dev)
    default: 6.18.1

outputs:
  zip:
    description: Path of the zip holding <name>/ with the binaries and the sources
    value: ${{ steps.paths.outputs.out }}/${{ steps.paths.outputs.name }}-${{ inputs.target }}.zip
  log:
    description: Path of build.log, which also holds the error when the build fails
    value: ${{ steps.paths.outputs.out }}/build.log
  name:
    description: Program name
    value: ${{ steps.paths.outputs.name }}
  arch:
    description: Architecture of the result (universal, arm64 or x86_64)
    value: ${{ steps.paths.outputs.arch }}
  faust-commit:
    description: Faust commit used
    value: ${{ steps.paths.outputs.faust_sha }}

runs:
  using: composite
  steps:
    # Which runner each target needs. On macOS the runner must be arm64: the
    # universal builds rely on it (faust2puredata and faust2supercollider
    # only build both architectures there, and on an Intel Mac faustoptflags
    # adds -march=native, which would tune the code for the runner's CPU).
    # On Linux and Windows the result is built for the runner's architecture.
    - name: Check the runner and the inputs
      id: paths
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        DSP_INPUT: ${{ inputs.dsp }}
        NAME_INPUT: ${{ inputs.name }}
        ARCH_INPUT: ${{ inputs.arch }}
        FROM_EVENT: ${{ inputs.dsp-from-event }}
        FAUST_REF: ${{ inputs.faust-ref }}
      run: |
        set -euo pipefail
        os=$RUNNER_OS; machine=$RUNNER_ARCH
        case "$TARGET" in
            caqt|jaqt) systems="macOS" ;;
            max) systems="macOS Windows" ;;
            juce) systems="macOS Linux Windows" ;;
            puredata|supercollider|csound) systems="macOS Linux" ;;
            lv2) systems="Linux" ;;
            *) echo "::error::unknown target '$TARGET' (max, caqt, jaqt, juce, lv2, puredata, supercollider, csound)"; exit 1 ;;
        esac
        [[ " $systems " == *" $os "* ]] || { echo "::error::target $TARGET builds on $systems, not on $os: change runs-on"; exit 1; }
        case "$os:$machine" in
            macOS:ARM64|Linux:X64|Linux:ARM64|Windows:X64) ;;
            macOS:*) echo "::error::this action needs an arm64 macOS runner (runs-on: macos-15), not $machine"; exit 1 ;;
            *) echo "::error::$os $machine runners are not supported"; exit 1 ;;
        esac
        arch=$ARCH_INPUT
        if [ "$arch" = auto ]; then
            if [ "$os" = macOS ]; then arch=universal
            elif [ "$machine" = ARM64 ]; then arch=arm64
            else arch=x86_64; fi
            [ "$TARGET" = jaqt ] && arch=arm64
        fi
        name=$NAME_INPUT
        if [ "$FROM_EVENT" = true ]; then
            [ -z "$DSP_INPUT" ] || { echo "::error::give dsp or dsp-from-event, not both"; exit 1; }
            [ -n "$name" ] || { echo "::error::dsp-from-event needs a name"; exit 1; }
        else
            [ -n "$DSP_INPUT" ] || { echo "::error::give the path of a .dsp file in dsp"; exit 1; }
            [ -n "$name" ] || name=$(basename "$DSP_INPUT" .dsp)
        fi
        [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
            || { echo "::error::invalid name '$name': letters, digits and '_' only, not starting with a digit (set the name input)"; exit 1; }
        sha=$(git ls-remote https://github.com/grame-cncm/faust "refs/heads/$FAUST_REF" | cut -f1)
        [ -n "$sha" ] || { echo "::error::branch '$FAUST_REF' not found in grame-cncm/faust"; exit 1; }
        out="$RUNNER_TEMP/faustosx/$TARGET-$name"
        prefix="$RUNNER_TEMP/faust-install"
        if [ "$os" = Windows ]; then out=$(cygpath -m "$out"); prefix=$(cygpath -m "$prefix"); fi
        {
            echo "name=$name"
            echo "arch=$arch"
            echo "out=$out"
            echo "faust_sha=$sha"
            echo "faust_prefix=$prefix"
            # scripts: the action's scripts directory, as a path bash runs
            if [ "$os" = Windows ]; then
                echo "scripts=$(cygpath -u "$GITHUB_ACTION_PATH")/scripts"
            else
                echo "scripts=$GITHUB_ACTION_PATH/scripts"
            fi
        } >> "$GITHUB_OUTPUT"

    # Faust, built once per commit and system and cached. Restore and save
    # are separate steps: actions/cache saves only when the whole job
    # succeeds, and a job fails whenever the user's program does not
    # compile.
    - name: Restore Faust
      id: faust-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.paths.outputs.faust_prefix }}
        key: faust-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.faust_sha }}
    - name: Install what the Faust build needs (Linux)
      if: runner.os == 'Linux' && steps.faust-cache.outputs.cache-hit != 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libmicrohttpd-dev > /dev/null
    - name: Build Faust
      if: steps.faust-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SHA: ${{ steps.paths.outputs.faust_sha }}
        PREFIX: ${{ steps.paths.outputs.faust_prefix }}
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then "$SCRIPTS/setup/faust-windows.sh"; else "$SCRIPTS/setup/faust.sh"; fi
    - name: Save Faust
      if: steps.faust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.paths.outputs.faust_prefix }}
        key: ${{ steps.faust-cache.outputs.cache-primary-key }}
    - name: Add Faust to the PATH
      shell: bash
      env:
        PREFIX: ${{ steps.paths.outputs.faust_prefix }}
      run: |
        echo "$PREFIX/bin" >> "$GITHUB_PATH"
        "$PREFIX/bin/faust" --version | head -n 2

    # Linux packages of each target
    - name: Install the target's packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        case "$TARGET" in
            lv2) packages="lv2-dev libboost-dev" ;;
            puredata) packages="puredata-dev" ;;
            supercollider) packages="supercollider-dev ruby" ;;
            csound) packages="libcsound64-dev" ;;
            # JUCE's Linux dependencies, without curl and webkit
            # (faust2juce's project sets JUCE_USE_CURL=0, JUCE_WEB_BROWSER=0)
            juce) packages="libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev" ;;
            *) packages="" ;;
        esac
        if [ -n "$packages" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq $packages > /dev/null
            echo "installed: $packages"
        fi

    # Qt, for caqt and jaqt (macOS)
    - name: Restore Qt
      if: inputs.target == 'caqt' || inputs.target == 'jaqt'
      id: qt-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-${{ runner.os }}-${{ inputs.qt }}-aqt3.3.0
    - name: Install Qt
      if: (inputs.target == 'caqt' || inputs.target == 'jaqt') && steps.qt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        QT_VERSION: ${{ inputs.qt }}
        ROOT: ${{ runner.temp }}/Qt
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: '"$SCRIPTS/setup/qt.sh"'
    - name: Save Qt
      if: (inputs.target == 'caqt' || inputs.target == 'jaqt') && steps.qt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/Qt
        key: ${{ steps.qt-cache.outputs.cache-primary-key }}

    # JACK, for jaqt (Homebrew's, arm64)
    - name: Install JACK
      if: inputs.target == 'jaqt'
      shell: bash
      run: |
        brew install --quiet jack
        echo "jack $(pkg-config --modversion jack) in $(pkg-config --variable=libdir jack)"

    # JUCE, for juce
    - name: Restore JUCE
      if: inputs.target == 'juce'
      id: juce-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/JUCE
        key: juce-${{ inputs.juce }}
    - name: Fetch JUCE
      if: inputs.target == 'juce' && steps.juce-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        JUCE_VERSION: ${{ inputs.juce }}
        JUCEDIR: ${{ runner.temp }}/JUCE
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: '"$SCRIPTS/setup/juce.sh"'
    - name: Save JUCE
      if: inputs.target == 'juce' && steps.juce-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/JUCE
        key: ${{ steps.juce-cache.outputs.cache-primary-key }}

    # Max SDK headers, for max
    - name: Get the Max SDK
      if: inputs.target == 'max'
      shell: bash
      env:
        DEST: ${{ runner.temp }}/max-sdk-base
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: '"$SCRIPTS/setup/maxsdk.sh"'

    # m_pd.h, for puredata on macOS
    - name: Get m_pd.h
      if: inputs.target == 'puredata' && runner.os == 'macOS'
      shell: bash
      env:
        PD_VERSION: ${{ inputs.pd }}
        DEST: ${{ runner.temp }}/pd
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: '"$SCRIPTS/setup/pd.sh"'

    # SuperCollider headers, for supercollider on macOS
    - name: Get the SuperCollider headers
      if: inputs.target == 'supercollider' && runner.os == 'macOS'
      shell: bash
      env:
        SC_VERSION: ${{ inputs.sc }}
        DEST: ${{ runner.temp }}/sc
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: '"$SCRIPTS/setup/sc.sh"'

    # Csound headers, for csound on macOS, cached
    - name: Restore the Csound headers
      if: inputs.target == 'csound' && runner.os == 'macOS'
      id: csound-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/csound-headers
        key: csound-headers-${{ inputs.csound }}
    - name: Get the Csound headers
      if: inputs.target == 'csound' && runner.os == 'macOS' && steps.csound-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CSOUND_VERSION: ${{ inputs.csound }}
        DEST: ${{ runner.temp }}/csound-headers
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
      run: '"$SCRIPTS/setup/csound.sh"'
    - name: Save the Csound headers
      if: inputs.target == 'csound' && runner.os == 'macOS' && steps.csound-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/csound-headers
        key: ${{ steps.csound-cache.outputs.cache-primary-key }}

    # The inputs reach the script through the environment only: expanding
    # them inside the script text would let them run shell commands. With
    # dsp-from-event, the source is not in the environment either: lib.sh
    # reads it from the event payload, since the log prints each step's
    # environment.
    - name: Compile
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        DSP_FILE: ${{ inputs.dsp }}
        FAUSTOSX_FROM_EVENT: ${{ inputs.dsp-from-event == 'true' && '1' || '' }}
        NAME: ${{ steps.paths.outputs.name }}
        OPTIONS: ${{ inputs.options }}
        ARCH: ${{ steps.paths.outputs.arch }}
        OUT: ${{ steps.paths.outputs.out }}
        SCRIPTS: ${{ steps.paths.outputs.scripts }}
        MAXSDK: ${{ runner.temp }}/max-sdk-base/c74support
        QTDIR: ${{ runner.temp }}/Qt/${{ inputs.qt }}/macos
        JUCEDIR: ${{ runner.temp }}/JUCE
        PUREDATA_MACSDK: ${{ runner.temp }}/pd
        SUPERCOLLIDER_HEADERS: ${{ runner.os == 'Linux' && '/usr/include/SuperCollider' || format('{0}/sc/include', runner.temp) }}
        CSOUND_HEADERS: ${{ runner.os == 'Linux' && '/usr/include/csound' || format('{0}/csound-headers', runner.temp) }}
      run: '"$SCRIPTS/build-$TARGET.sh"'
