name: Faust build
description: >
  Compile a Faust program into macOS binaries (Intel and Apple Silicon):
  Max externals, CoreAudio/Qt or JACK/Qt applications, JUCE plugins, Pure
  Data externals, SuperCollider UGens or Csound opcodes.
author: GRAME
branding:
  icon: music
  color: orange

inputs:
  target:
    description: max, caqt, jaqt (arm64 only), juce, puredata, supercollider or csound
    required: true
  dsp:
    description: >
      Path of the .dsp file, relative to the workspace. The files next to it
      with the extensions .lib, .dsp, .json, .wav, .aif, .aiff, .flac, .ogg
      and .mp3 are taken with it.
    default: ""
  dsp-from-event:
    description: >
      "true" to take the source from the dsp or archive input of the
      workflow_dispatch event instead of a file (used by the workflows of
      grame-cncm/faust-actions)
    default: "false"
  name:
    description: "Program name, without .dsp (default: the name of the dsp file)"
    default: ""
  options:
    description: Options for the faust2xxx script, checked against its allow-list
    default: ""
  arch:
    description: universal, arm64 or x86_64 (jaqt only builds arm64)
    default: universal
  faust-ref:
    description: Branch of grame-cncm/faust to build Faust from (faust2max6 and faust2caqt need -arch, not in a release yet)
    default: master-dev
  qt:
    description: Qt version, for caqt and jaqt
    default: 6.8.3
  juce:
    description: JUCE tag, for juce
    default: 8.0.10
  pd:
    description: Pure Data tag whose m_pd.h is used, for puredata
    default: 0.56-5
  sc:
    description: SuperCollider tag whose headers are used, for supercollider
    default: Version-3.14.1
  csound:
    description: Csound release whose headers are used, for csound
    default: 6.18.1

outputs:
  zip:
    description: Path of the zip holding <name>/ with the binaries and the sources
    value: ${{ steps.paths.outputs.out }}/${{ steps.paths.outputs.name }}-${{ inputs.target }}.zip
  log:
    description: Path of build.log, which also holds the error when the build fails
    value: ${{ steps.paths.outputs.out }}/build.log
  name:
    description: Program name
    value: ${{ steps.paths.outputs.name }}
  faust-commit:
    description: Faust commit used
    value: ${{ steps.paths.outputs.faust_sha }}

runs:
  using: composite
  steps:
    # The universal builds rely on an arm64 runner: faust2puredata and
    # faust2supercollider only build both architectures there, and on an
    # Intel Mac faustoptflags adds -march=native, which would tune the code
    # for the runner's CPU.
    - name: Check the runner and the inputs
      id: paths
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        DSP_INPUT: ${{ inputs.dsp }}
        NAME_INPUT: ${{ inputs.name }}
        FROM_EVENT: ${{ inputs.dsp-from-event }}
        FAUST_REF: ${{ inputs.faust-ref }}
      run: |
        set -euo pipefail
        [ "$(uname -s)" = Darwin ] && [ "$(uname -m)" = arm64 ] \
            || { echo "::error::this action needs an arm64 macOS runner (runs-on: macos-15), not $(uname -s) $(uname -m)"; exit 1; }
        case "$TARGET" in
            max|caqt|jaqt|juce|puredata|supercollider|csound) ;;
            *) echo "::error::unknown target '$TARGET' (max, caqt, jaqt, juce, puredata, supercollider, csound)"; exit 1 ;;
        esac
        name=$NAME_INPUT
        if [ "$FROM_EVENT" = true ]; then
            [ -z "$DSP_INPUT" ] || { echo "::error::give dsp or dsp-from-event, not both"; exit 1; }
            [ -n "$name" ] || { echo "::error::dsp-from-event needs a name"; exit 1; }
        else
            [ -n "$DSP_INPUT" ] || { echo "::error::give the path of a .dsp file in dsp"; exit 1; }
            [ -n "$name" ] || name=$(basename "$DSP_INPUT" .dsp)
        fi
        [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
            || { echo "::error::invalid name '$name': letters, digits and '_' only, not starting with a digit (set the name input)"; exit 1; }
        sha=$(git ls-remote https://github.com/grame-cncm/faust "refs/heads/$FAUST_REF" | cut -f1)
        [ -n "$sha" ] || { echo "::error::branch '$FAUST_REF' not found in grame-cncm/faust"; exit 1; }
        {
            echo "name=$name"
            echo "out=$RUNNER_TEMP/faustosx/$TARGET-$name"
            echo "faust_sha=$sha"
            echo "faust_prefix=$RUNNER_TEMP/faust-install"
        } >> "$GITHUB_OUTPUT"

    # Faust, built once per commit and cached. Restore and save are separate
    # steps: actions/cache saves only when the whole job succeeds, and a job
    # fails whenever the user's program does not compile.
    - name: Restore Faust
      id: faust-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.paths.outputs.faust_prefix }}
        key: faust-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.faust_sha }}
    - name: Build Faust
      if: steps.faust-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SHA: ${{ steps.paths.outputs.faust_sha }}
        PREFIX: ${{ steps.paths.outputs.faust_prefix }}
      run: '"$GITHUB_ACTION_PATH/scripts/setup/faust.sh"'
    - name: Save Faust
      if: steps.faust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.paths.outputs.faust_prefix }}
        key: ${{ steps.faust-cache.outputs.cache-primary-key }}
    - name: Add Faust to the PATH
      shell: bash
      env:
        PREFIX: ${{ steps.paths.outputs.faust_prefix }}
      run: |
        echo "$PREFIX/bin" >> "$GITHUB_PATH"
        "$PREFIX/bin/faust" --version | head -n 2

    # Qt, for caqt and jaqt
    - name: Restore Qt
      if: inputs.target == 'caqt' || inputs.target == 'jaqt'
      id: qt-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-${{ runner.os }}-${{ inputs.qt }}-aqt3.3.0
    - name: Install Qt
      if: (inputs.target == 'caqt' || inputs.target == 'jaqt') && steps.qt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        QT_VERSION: ${{ inputs.qt }}
        ROOT: ${{ runner.temp }}/Qt
      run: '"$GITHUB_ACTION_PATH/scripts/setup/qt.sh"'
    - name: Save Qt
      if: (inputs.target == 'caqt' || inputs.target == 'jaqt') && steps.qt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/Qt
        key: ${{ steps.qt-cache.outputs.cache-primary-key }}

    # JACK, for jaqt (Homebrew's, arm64)
    - name: Install JACK
      if: inputs.target == 'jaqt'
      shell: bash
      run: |
        brew install --quiet jack
        echo "jack $(pkg-config --modversion jack) in $(pkg-config --variable=libdir jack)"

    # JUCE, for juce
    - name: Restore JUCE
      if: inputs.target == 'juce'
      id: juce-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/JUCE
        key: juce-${{ inputs.juce }}
    - name: Fetch JUCE
      if: inputs.target == 'juce' && steps.juce-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        JUCE_VERSION: ${{ inputs.juce }}
        JUCEDIR: ${{ runner.temp }}/JUCE
      run: '"$GITHUB_ACTION_PATH/scripts/setup/juce.sh"'
    - name: Save JUCE
      if: inputs.target == 'juce' && steps.juce-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/JUCE
        key: ${{ steps.juce-cache.outputs.cache-primary-key }}

    # Max SDK headers, for max
    - name: Get the Max SDK
      if: inputs.target == 'max'
      shell: bash
      env:
        DEST: ${{ runner.temp }}/max-sdk-base
      run: '"$GITHUB_ACTION_PATH/scripts/setup/maxsdk.sh"'

    # m_pd.h, for puredata
    - name: Get m_pd.h
      if: inputs.target == 'puredata'
      shell: bash
      env:
        PD_VERSION: ${{ inputs.pd }}
        DEST: ${{ runner.temp }}/pd
      run: '"$GITHUB_ACTION_PATH/scripts/setup/pd.sh"'

    # SuperCollider headers, for supercollider
    - name: Get the SuperCollider headers
      if: inputs.target == 'supercollider'
      shell: bash
      env:
        SC_VERSION: ${{ inputs.sc }}
        DEST: ${{ runner.temp }}/sc
      run: '"$GITHUB_ACTION_PATH/scripts/setup/sc.sh"'

    # Csound headers, for csound, cached
    - name: Restore the Csound headers
      if: inputs.target == 'csound'
      id: csound-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/csound-headers
        key: csound-headers-${{ inputs.csound }}
    - name: Get the Csound headers
      if: inputs.target == 'csound' && steps.csound-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CSOUND_VERSION: ${{ inputs.csound }}
        DEST: ${{ runner.temp }}/csound-headers
      run: '"$GITHUB_ACTION_PATH/scripts/setup/csound.sh"'
    - name: Save the Csound headers
      if: inputs.target == 'csound' && steps.csound-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/csound-headers
        key: ${{ steps.csound-cache.outputs.cache-primary-key }}

    # The inputs reach the script through the environment only: expanding
    # them inside the script text would let them run shell commands. With
    # dsp-from-event, the source is not in the environment either: lib.sh
    # reads it from the event payload, since the log prints each step's
    # environment.
    - name: Compile
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        DSP_FILE: ${{ inputs.dsp }}
        FAUSTOSX_FROM_EVENT: ${{ inputs.dsp-from-event == 'true' && '1' || '' }}
        NAME: ${{ steps.paths.outputs.name }}
        OPTIONS: ${{ inputs.options }}
        ARCH: ${{ inputs.arch }}
        OUT: ${{ steps.paths.outputs.out }}
        MAXSDK: ${{ runner.temp }}/max-sdk-base/c74support
        QTDIR: ${{ runner.temp }}/Qt/${{ inputs.qt }}/macos
        JUCEDIR: ${{ runner.temp }}/JUCE
        PUREDATA_MACSDK: ${{ runner.temp }}/pd
        SUPERCOLLIDER_HEADERS: ${{ runner.temp }}/sc/include
        CSOUND_HEADERS: ${{ runner.temp }}/csound-headers
      run: '"$GITHUB_ACTION_PATH/scripts/build-$TARGET.sh"'
