name: Test the action

# Uses action.yml as another repository would: with a .dsp file of the
# repository (tests/withlib/withlib.dsp, which imports mylib.lib next to
# it), for every target on every system it supports, and checks the zip
# it returns. Also runs the standalone setup actions.
run-name: test action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: max }
          - { runner: macos-15, target: caqt }
          - { runner: macos-15, target: jaqt }
          - { runner: macos-15, target: juce }
          - { runner: macos-15, target: puredata }
          - { runner: macos-15, target: supercollider }
          - { runner: macos-15, target: csound }
          - { runner: ubuntu-24.04, target: lv2 }
          - { runner: ubuntu-24.04, target: juce }
          - { runner: ubuntu-24.04, target: puredata }
          - { runner: ubuntu-24.04, target: supercollider }
          - { runner: ubuntu-24.04, target: csound }
          - { runner: ubuntu-24.04-arm, target: lv2 }
          - { runner: ubuntu-24.04-arm, target: puredata }
          - { runner: windows-2025, target: juce }
    name: ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Build
        id: build
        uses: ./
        with:
          target: ${{ matrix.target }}
          dsp: tests/withlib/withlib.dsp

      - name: Check the zip
        shell: bash
        env:
          ZIP: ${{ steps.build.outputs.zip }}
          NAME: ${{ steps.build.outputs.name }}
          ARCH: ${{ steps.build.outputs.arch }}
        run: |
          set -euo pipefail
          echo "zip: $ZIP, name: $NAME, arch: $ARCH, faust: ${{ steps.build.outputs.faust-commit }}"
          "$(command -v python3 || command -v python)" - "$ZIP" "$NAME" <<'EOF'
          import sys, zipfile
          path, name = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(path).namelist()
          print(f"{len(names)} entries")
          for n in sorted(names):
              if n.count("/") <= 2:
                  print("  " + n)
          missing = [f for f in (f"{name}/withlib.dsp", f"{name}/mylib.lib") if f not in names]
          if missing:
              sys.exit(f"::error::the zip lacks {missing}")
          EOF

      - name: Upload the result
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.target }}-${{ matrix.runner }}
          path: ${{ steps.build.outputs.zip }}
          retention-days: 1

  # The standalone setup actions, as another repository would use them
  setup-actions:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-faust
      - uses: ./setup-qt
        id: qt
      - uses: ./setup-juce
        id: juce
      - name: Check
        env:
          QTDIR: ${{ steps.qt.outputs.qtdir }}
          JUCEDIR: ${{ steps.juce.outputs.jucedir }}
        run: |
          set -euo pipefail
          faust --version | head -n 2
          command -v faust2caqt
          "$QTDIR/bin/qmake" -query QT_VERSION
          test -f "$JUCEDIR/CMakeLists.txt" && echo "JUCE in $JUCEDIR"
