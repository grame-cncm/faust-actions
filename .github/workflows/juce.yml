name: JUCE plugins

# Compiles one Faust program with the action of this repository
# (action.yml, target juce) and returns the AU, VST3 and Standalone builds as a zip artifact named
# <name>-juce.zip, plus the build log as <name>-log. The source comes
# from the dsp or archive input, which the log does not show.
run-name: juce ${{ inputs.name }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      dsp:
        description: Faust source code (or use archive)
        default: ""
        type: string
      archive:
        description: Instead of dsp, base64 of a tar.gz holding <name>.dsp and the files it imports, without directories
        default: ""
        type: string
      name:
        description: Program name, without .dsp
        default: foo
        type: string
      options:
        description: Extra faust2juce options
        default: ""
        type: string
      arch:
        description: Architecture of the result
        default: universal
        type: choice
        options: [universal, arm64, x86_64]
      juce:
        description: JUCE version (a tag of juce-framework/JUCE)
        default: 8.0.10
        type: string
      tag:
        description: Free text added to the run name, so a client can find its run
        default: ""
        type: string

permissions:
  contents: read

jobs:
  juce:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build
        id: build
        uses: ./
        with:
          target: juce
          dsp-from-event: "true"
          name: ${{ inputs.name }}
          options: ${{ inputs.options }}
          arch: ${{ inputs.arch }}
          juce: ${{ inputs.juce }}

      - name: Upload the result
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      # The path is spelled out: the outputs of the action are not set when
      # it fails, and the log is what explains the failure.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-log
          path: ${{ runner.temp }}/faustosx/juce-${{ inputs.name }}/build.log
          retention-days: 7
          if-no-files-found: ignore
